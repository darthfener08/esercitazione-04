<!DOCTYPE html>

                        <option value="2026">2026</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>Cilindrata</th>
                <td><input type="number" name="cilindrata"></td>
            </tr>
            <tr>
                <th>Cavalli</th>

            </tr>
            <tr>

            </tr>
